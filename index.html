<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Portfolio de Clovis Langlois.">
  <title>Clovis Langlois — Portfolio</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #161a23;
      color: #f7f8fa;
      font-family: Arial, Helvetica, sans-serif;
      text-align: center;
    }
    main { padding: 32px 20px; }
    h1 { margin: 0; font-size: clamp(36px, 6vw, 64px); font-weight: 600; letter-spacing: -.035em; }
    p { margin: 18px 0 0; color: #aeb8c8; font-size: 16px; }
  </style>
</head>
<body>
  <main>
    <h1>Clovis Langlois</h1>
    <p>Portfolio en cours de reconstruction</p>
  </main>
</body>
</html>
