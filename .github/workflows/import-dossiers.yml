name: Import technical PDF dossiers and PDF.js viewer
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/import-dossiers.yml

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the portfolio
        uses: actions/checkout@v4
      - name: Fetch the original PDF dossiers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/dossiers assets/vendor
          curl --fail --show-error --location --retry 3 --retry-all-errors --connect-timeout 20 --max-time 240 \
            --user-agent "Mozilla/5.0" \
            "https://assets.zyrosite.com/kDsAjPW6LAjAZlYh/projet-langa-c-o-education-UWEqbAn0rlhG6OTt.pdf" \
            --output assets/dossiers/langeo-infrastructure.pdf
          curl --fail --show-error --location --retry 3 --retry-all-errors --connect-timeout 20 --max-time 240 \
            --user-agent "Mozilla/5.0" \
            "https://assets.zyrosite.com/kDsAjPW6LAjAZlYh/projet-haute-disponibilita-c-sauvegarde-o7WweDvAqcZzUuVI.pdf" \
            --output assets/dossiers/langeo-haute-disponibilite.pdf
          for file in assets/dossiers/*.pdf; do
            test "$(head -c 5 "$file")" = '%PDF-' || { echo "Invalid PDF: $file"; exit 1; }
            test "$(stat -c%s "$file")" -gt 10000 || { echo "PDF too small: $file"; exit 1; }
            ls -lh "$file"
          done
      - name: Vendor PDF.js rendering library
        shell: bash
        run: |
          set -euo pipefail
          base="https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build"
          curl --fail --show-error --location --retry 3 --retry-all-errors --max-time 180 \
            "$base/pdf.mjs" --output assets/vendor/pdf.mjs
          curl --fail --show-error --location --retry 3 --retry-all-errors --max-time 180 \
            "$base/pdf.worker.mjs" --output assets/vendor/pdf.worker.mjs
          test "$(stat -c%s assets/vendor/pdf.mjs)" -gt 10000
          test "$(stat -c%s assets/vendor/pdf.worker.mjs)" -gt 10000
      - name: Commit imported files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/dossiers/*.pdf assets/vendor/pdf.mjs assets/vendor/pdf.worker.mjs
          if git diff --staged --quiet; then
            echo "Dossiers already up to date."
          else
            git commit -m "Host project PDF dossiers and PDF.js locally"
            git push
          fi
