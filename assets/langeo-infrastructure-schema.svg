<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="title desc">
<title id="title">Architecture réseau du projet Langéo Education</title>
<desc id="desc">Illustration de l'infrastructure virtualisée : pare-feu pfSense, hyperviseur Proxmox, annuaire Active Directory, supervision Zabbix et services applicatifs.</desc>
<defs>
<radialGradient id="bg" cx=".5" cy=".5" r=".8"><stop stop-color="#253d59"/><stop offset="1" stop-color="#172332"/></radialGradient>
<linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2b4059"/><stop offset="1" stop-color="#1d3045"/></linearGradient>
<linearGradient id="wire" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#527ba6"/><stop offset=".5" stop-color="#a0c7ed"/><stop offset="1" stop-color="#527ba6"/></linearGradient>
<pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse"><path d="M38 0H0V38" fill="none" stroke="#b7d9ff" stroke-opacity=".065" stroke-width="1"/></pattern>
<filter id="soft"><feGaussianBlur stdDeviation="7"/></filter>
</defs>
<style>
.line{fill:none;stroke:url(#wire);stroke-width:2;stroke-opacity:.55;stroke-linejoin:round;stroke-linecap:round}
.node{fill:url(#panel);stroke:#779ac0;stroke-opacity:.55;stroke-width:1.5}
.heading{fill:#eef5ff;font:600 24px Montserrat,Arial,sans-serif;letter-spacing:-.4px}
.sub{fill:#a9c3df;font:500 15px Montserrat,Arial,sans-serif}
.small{fill:#8fb2d6;font:600 12px Montserrat,Arial,sans-serif;letter-spacing:1.5px}
.dot{fill:#b6d9ff}
@media(prefers-reduced-motion:no-preference){.flow{stroke-dasharray:4 15;animation:move 14s linear infinite}.pulse{animation:glow 5s ease-in-out infinite}@keyframes move{to{stroke-dashoffset:-190}}@keyframes glow{50%{opacity:.75}}}
</style>
<rect width="800" height="560" fill="url(#bg)"/>
<rect width="800" height="560" fill="url(#grid)"/>
<circle cx="400" cy="265" r="185" fill="#4e8fc4" opacity=".06" filter="url(#soft)"/>
<text x="46" y="48" class="small">LANGÉO EDUCATION</text>
<text x="753" y="48" class="small" text-anchor="end">INFRASTRUCTURE VIRTUALISÉE</text>
<g class="line"><path d="M400 154V212"/><path d="M400 342V370H160V386"/><path d="M400 342V397"/><path d="M400 370H640V386"/></g>
<g class="line flow" stroke="#b1d7ff" stroke-opacity=".38"><path d="M400 154V212"/><path d="M400 342V370H160V386"/><path d="M400 342V397"/><path d="M400 370H640V386"/></g>
<g><rect class="node" x="291" y="78" width="218" height="76" rx="13"/><path d="M326 97l19 7v15c0 11-8 19-19 23-11-4-19-12-19-23v-15l19-7Z" fill="none" stroke="#b4d8f6" stroke-width="2.5"/><path d="m318 119 6 6 11-13" fill="none" stroke="#b4d8f6" stroke-width="2.5" stroke-linecap="round"/><text x="361" y="112" class="heading">pfSense</text><text x="361" y="134" class="sub">Pare-feu</text></g>
<g><rect x="261" y="213" width="278" height="129" rx="17" fill="#6d9dd0" opacity=".1" filter="url(#soft)"/><rect class="node" x="262" y="212" width="276" height="130" rx="17" stroke="#a8d1f7" stroke-opacity=".75"/><rect x="288" y="246" width="55" height="17" rx="4" fill="none" stroke="#a9d0f3" stroke-width="2"/><rect x="288" y="270" width="55" height="17" rx="4" fill="none" stroke="#a9d0f3" stroke-width="2"/><rect x="288" y="294" width="55" height="17" rx="4" fill="none" stroke="#a9d0f3" stroke-width="2"/><circle cx="330" cy="254.5" r="2.3" class="dot"/><circle cx="330" cy="278.5" r="2.3" class="dot"/><circle cx="330" cy="302.5" r="2.3" class="dot"/><text x="364" y="270" class="heading" font-size="28">Proxmox</text><text x="364" y="296" class="sub">Hyperviseur</text><text x="364" y="316" class="sub">Machines virtuelles</text></g>
<g><rect class="node" x="52" y="387" width="216" height="101" rx="13"/><circle cx="82" cy="420" r="9" fill="none" stroke="#a9d0f3" stroke-width="2"/><path d="M65 444c1-13 33-13 34 0" fill="none" stroke="#a9d0f3" stroke-width="2"/><text x="112" y="425" class="heading" style="font-size:18px">Active Directory</text><text x="112" y="450" class="sub">Annuaire · DNS</text></g>
<g><rect class="node" x="293" y="397" width="214" height="101" rx="13"/><rect x="316" y="427" width="39" height="30" rx="4" fill="none" stroke="#a9d0f3" stroke-width="2"/><path d="M325 446h7v-10h6v10h8" fill="none" stroke="#a9d0f3" stroke-width="2"/><text x="372" y="434" class="heading" style="font-size:19px">Services</text><text x="372" y="459" class="sub">GLPI · SSO · DMZ</text></g>
<g><rect class="node" x="532" y="387" width="216" height="101" rx="13"/><path d="m551 452 13-13 11 5 17-22" fill="none" stroke="#a9d0f3" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="592" cy="422" r="3.5" class="dot"/><text x="609" y="425" class="heading" style="font-size:21px">Zabbix</text><text x="609" y="450" class="sub">Supervision</text></g>
<g class="pulse"><circle cx="400" cy="183" r="5" class="dot" opacity=".4"/><circle cx="400" cy="183" r="2" fill="#e3f5ff"/><circle cx="160" cy="370" r="4" class="dot" opacity=".5"/><circle cx="640" cy="370" r="4" class="dot" opacity=".5"/></g>
<text x="400" y="535" text-anchor="middle" class="small" opacity=".72">RÉSEAUX · SYSTÈMES · SÉCURITÉ</text>
</svg>