<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#161a23">
<title>Dossier technique | Clovis Langlois</title>
<style>
:root{color-scheme:dark;--bg:#161a23;--surface:#202634;--text:#f4f7fc;--muted:#aebbd0;--line:rgba(172,197,226,.18);--accent:#a7cbf8}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased}
button,input{font:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.toolbar{height:66px;background:#161a23;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:20px;padding:0 clamp(14px,3vw,36px);position:relative;z-index:5}
.toolbar-title{display:flex;align-items:center;min-width:0;gap:22px}
.back{display:inline-flex;align-items:center;gap:9px;color:#a8c2e0;font-size:12px;font-weight:600;white-space:nowrap}
.back:hover{color:#fff}
.back-arrow{font-size:20px;line-height:1}
.document-title{font-weight:600;font-size:14px;letter-spacing:-.015em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools{display:flex;align-items:center;justify-content:flex-end;gap:15px;flex-shrink:0}
.tool-group{display:flex;align-items:center;gap:9px}
.control{height:34px;min-width:34px;display:inline-flex;align-items:center;justify-content:center;background:transparent;color:#d8e1ec;border:1px solid rgba(173,193,220,.22);border-radius:8px;padding:0 11px;font-size:15px;font-weight:500;transition:background .15s,border-color .15s}
.control:hover:not(:disabled){background:rgba(171,202,236,.1);border-color:rgba(172,200,236,.5)}
.control:disabled{opacity:.35;cursor:default}
.control--icon{font-size:20px;padding:0}
.control--fit{font-size:11px;font-weight:600;padding:0 11px;white-space:nowrap}
.counter{display:inline-flex;align-items:center;gap:7px;font-variant-numeric:tabular-nums;color:#becadc;font-size:12px;white-space:nowrap}
.page-input{height:31px;width:45px;background:#222a38;border:1px solid rgba(173,193,220,.25);border-radius:6px;text-align:center;color:#f0f4fb;font-variant-numeric:tabular-nums;font-size:12px;appearance:textfield}
.page-input::-webkit-inner-spin-button,.page-input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.zoom-level{font-size:12px;font-variant-numeric:tabular-nums;color:#c9d6e7;min-width:42px;text-align:center}
.separator{height:25px;width:1px;background:var(--line)}
.viewport{height:calc(100vh - 66px);height:calc(100dvh - 66px);background:#292e38;overflow:auto;overscroll-behavior:contain;scrollbar-color:#67778e #292e38;position:relative}
.pages{display:flex;flex-direction:column;align-items:center;gap:24px;padding:30px 24px 75px;position:relative;min-height:100%}
.pdf-page{flex:none;position:relative;background:white;box-shadow:0 3px 20px rgba(0,0,0,.32);isolation:isolate}
.pdf-page canvas{display:block;max-width:none}
.pdf-page.is-loading::after{content:"";position:absolute;left:50%;top:50%;width:22px;height:22px;border-radius:50%;border:2px solid #e1e7f0;border-top-color:#8398b0;transform:translate(-50%,-50%);animation:spin 1.2s linear infinite;pointer-events:none}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.status{position:absolute;inset:0;z-index:4;display:flex;align-items:center;justify-content:center;padding:28px;background:#292e38}
.status[hidden]{display:none}
.status-content{text-align:center;max-width:500px}
.status-content h1{font-size:23px;margin:0 0 13px;font-weight:600;letter-spacing:-.025em}
.status-content p{color:#b8c5d6;font-size:14px;line-height:1.75;margin:0}
.status-content .retry{display:none;margin:25px auto 0;background:transparent;border:1px solid #788fae;color:#e8f1ff;border-radius:999px;padding:12px 20px;font-weight:600;font-size:12px}
.status.is-error .retry{display:inline-flex}
.status.is-error .status-content h1{color:#f5f7fb}
/* Présentation : une page complète à la fois, centrée sur l'écran. */
.presentation{position:fixed;inset:0;width:100%;height:100vh;height:100dvh;background:#11151d;z-index:50;display:flex;flex-direction:column;align-items:stretch;overflow:hidden}
.presentation[hidden]{display:none}
.presentation-stage{flex:1;min-height:0;min-width:0;display:flex;align-items:center;justify-content:center;padding:24px 24px 8px;overflow:hidden}
.presentation-stage canvas{display:block;max-width:100%;max-height:100%;background:#fff;box-shadow:0 4px 30px rgba(0,0,0,.42)}
.presentation-controls{flex:none;min-height:70px;display:flex;align-items:center;justify-content:center;gap:15px;padding:9px 16px 16px}
.presentation-counter{font-size:13px;color:#c1cad8;min-width:84px;text-align:center;font-variant-numeric:tabular-nums}
.presentation-exit{margin-left:25px;white-space:nowrap;font-size:12px;font-weight:600;gap:9px}
.presentation[hidden],.presentation-stage:empty{background:#11151d}
@media(max-width:580px){.presentation-stage{padding:12px 12px 5px}.presentation-controls{gap:9px}.presentation-exit{margin-left:7px}}

@media(max-width:920px){
.toolbar{gap:12px}
.toolbar-title{gap:12px}
.document-title{max-width:250px;font-size:12px}
.tools{gap:9px}
}
@media(max-width:690px){
.toolbar{height:104px;display:grid;grid-template-columns:1fr;grid-template-rows:40px 48px;gap:0;padding:8px 14px}
.toolbar-title{justify-content:space-between}
.document-title{flex:1;text-align:right;max-width:none}
.tools{justify-content:center;gap:10px}
.viewport{height:calc(100vh - 104px);height:calc(100dvh - 104px)}
.pages{padding:15px 12px 46px;gap:14px}
.control--fit{padding:0 8px}
}
@media(prefers-reduced-motion:reduce){.pdf-page.is-loading::after{animation:none}*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<header class="toolbar">
  <div class="toolbar-title">
    <a class="back" href="/projets/" aria-label="Retour aux projets"><span class="back-arrow" aria-hidden="true">←</span> Projets</a>
    <div class="document-title" id="document-title">Dossier technique</div>
  </div>
  <div class="tools" aria-label="Commandes du lecteur PDF">
    <div class="tool-group">
      <button class="control control--icon" id="previous" type="button" aria-label="Page précédente" disabled>‹</button>
      <label class="counter" for="page-input"><input class="page-input" id="page-input" type="number" min="1" value="1" aria-label="Numéro de page" disabled> / <span id="total-pages">—</span></label>
      <button class="control control--icon" id="next" type="button" aria-label="Page suivante" disabled>›</button>
    </div>
    <span class="separator" aria-hidden="true"></span>
    <div class="tool-group">
      <button class="control control--icon" id="zoom-out" type="button" aria-label="Réduire le zoom" disabled>−</button>
      <span class="zoom-level" id="zoom-label" aria-label="Niveau de zoom">—</span>
      <button class="control control--icon" id="zoom-in" type="button" aria-label="Augmenter le zoom" disabled>+</button>
      <button class="control control--fit" id="fit" type="button" title="Afficher une page entière en mode présentation" disabled>Présenter</button>
    </div>
  </div>
</header>
<main class="viewport" id="viewport" aria-label="Document PDF" tabindex="0">
  <div class="pages" id="pages"></div>
  <div class="status" id="status" role="status" aria-live="polite">
    <div class="status-content">
      <h1 id="status-title">Chargement du dossier…</h1>
      <p id="status-text">Préparation de la visionneuse.</p>
      <button class="retry" id="retry" type="button">Réessayer</button>
    </div>
  </div>
</main>
<section class="presentation" id="presentation" role="dialog" aria-modal="true" aria-label="Présentation du document PDF" hidden>
  <div class="presentation-stage" id="presentation-stage" aria-label="Page présentée"></div>
  <div class="presentation-controls" aria-label="Navigation de la présentation">
    <button class="control control--icon" id="presentation-previous" type="button" aria-label="Page précédente">‹</button>
    <span class="presentation-counter" id="presentation-counter" aria-live="polite">1 / —</span>
    <button class="control control--icon" id="presentation-next" type="button" aria-label="Page suivante">›</button>
    <button class="control presentation-exit" id="presentation-close" type="button" title="Quitter la présentation (Échap)">Quitter <span aria-hidden="true">×</span></button>
  </div>
</section>
<script type="module">
import * as pdfjsLib from '/assets/vendor/pdf.mjs';

pdfjsLib.GlobalWorkerOptions.workerSrc = new URL('/assets/vendor/pdf.worker.mjs', location.origin).href;
const documents={
  infrastructure:{title:'Infrastructure virtualisée sécurisée · Langéo Education',file:'/assets/dossiers/langeo-infrastructure.pdf'},
  'haute-disponibilite':{title:'Haute disponibilité et sauvegardes · Langéo Education',file:'/assets/dossiers/langeo-haute-disponibilite.pdf'}
};
const key=new URLSearchParams(location.search).get('projet');
const documentInfo=documents[key];
const viewport=document.getElementById('viewport');
const pagesEl=document.getElementById('pages');
const overlay=document.getElementById('status');
const statusTitle=document.getElementById('status-title');
const statusText=document.getElementById('status-text');
const pageInput=document.getElementById('page-input');
const totalPages=document.getElementById('total-pages');
const previous=document.getElementById('previous');
const next=document.getElementById('next');
const zoomIn=document.getElementById('zoom-in');
const zoomOut=document.getElementById('zoom-out');
const zoomLabel=document.getElementById('zoom-label');
const fitButton=document.getElementById('fit');
const presentation=document.getElementById('presentation');
const presentationStage=document.getElementById('presentation-stage');
const presentationPrevious=document.getElementById('presentation-previous');
const presentationNext=document.getElementById('presentation-next');
const presentationCounter=document.getElementById('presentation-counter');
const presentationClose=document.getElementById('presentation-close');
const controls=[previous,next,pageInput,zoomIn,zoomOut,fitButton];
let pdf=null;
let sheets=[];
let currentPage=1;
let firstWidth=595;
let firstHeight=842;
let scale=1;
let ready=false;
let scrollingUpdate=false;
let lastViewerWidth=0;
let presenting=false;
let presentationPage=1;
let presentationGeneration=0;
let presentationRenderTask=null;
let presentationLastFocus=null;

function errorState(message){
  statusTitle.textContent='Impossible d’afficher ce dossier';
  statusText.textContent=message;
  overlay.classList.add('is-error');
  overlay.hidden=false;
}
function clamp(value,min,max){return Math.max(min,Math.min(max,value))}
function fitScale(){
  const targetWidth=Math.min(Math.max(viewport.clientWidth-40,230),1050);
  return clamp(targetWidth/firstWidth,.35,2.7);
}
function updateToolbar(){
  pageInput.value=currentPage;
  previous.disabled=!ready||currentPage<=1;
  next.disabled=!ready||currentPage>=pdf.numPages;
  zoomIn.disabled=!ready||scale>=3.4;
  zoomOut.disabled=!ready||scale<=.4;
  zoomLabel.textContent=Math.round(scale*100)+' %';
}
function setSheetSize(sheet){
  const width=Math.round((sheet.baseWidth||firstWidth)*scale);
  const height=Math.round((sheet.baseHeight||firstHeight)*scale);
  sheet.el.style.width=width+'px';
  sheet.el.style.height=height+'px';
}
function clearSheet(sheet){
  sheet.generation++;
  if(sheet.renderTask){try{sheet.renderTask.cancel()}catch(e){}}
  sheet.renderTask=null;
  sheet.renderedAt=0;
  sheet.el.querySelector('canvas')?.remove();
  sheet.el.classList.add('is-loading');
}
async function renderSheet(sheet){
  if(sheet.renderedAt===scale||sheet.renderTask||sheet.loading)return;
  sheet.loading=true;
  const generation=sheet.generation;
  try{
    const page=sheet.page||(sheet.page=await pdf.getPage(sheet.number));
    sheet.baseWidth=page.getViewport({scale:1}).width;
    sheet.baseHeight=page.getViewport({scale:1}).height;
    if(generation!==sheet.generation)return;
    setSheetSize(sheet);
    const pageViewport=page.getViewport({scale});
    const outputScale=clamp(window.devicePixelRatio||1,1,2);
    const canvas=document.createElement('canvas');
    const context=canvas.getContext('2d',{alpha:false});
    if(!context)throw new Error('Canvas indisponible');
    canvas.width=Math.floor(pageViewport.width*outputScale);
    canvas.height=Math.floor(pageViewport.height*outputScale);
    canvas.style.width=Math.round(pageViewport.width)+'px';
    canvas.style.height=Math.round(pageViewport.height)+'px';
    const renderTask=page.render({
      canvasContext:context,
      viewport:pageViewport,
      transform:outputScale!==1?[outputScale,0,0,outputScale,0,0]:undefined
    });
    sheet.renderTask=renderTask;
    await renderTask.promise;
    if(generation!==sheet.generation)return;
    sheet.el.querySelector('canvas')?.remove();
    sheet.el.appendChild(canvas);
    sheet.el.classList.remove('is-loading');
    sheet.renderedAt=scale;
  }catch(err){
    if(err?.name!=='RenderingCancelledException'){
      console.error('Erreur de rendu PDF :',err);
      sheet.el.classList.remove('is-loading');
      if(sheet.number===1&&!ready)errorState('Le rendu du document a échoué. Vous pouvez réessayer.');
    }
  }finally{
    if(generation===sheet.generation)sheet.renderTask=null;
    sheet.loading=false;
    // Relancer le rendu si un changement de zoom a annulé la tâche en cours.
    if(ready&&generation!==sheet.generation)scheduleVisibleUpdate();
  }
}
function updateVisiblePages(){
  if(!ready)return;
  const viewRect=viewport.getBoundingClientRect();
  const focusY=viewRect.top+viewport.clientHeight*.32;
  let closest=1;
  let closestDistance=Infinity;
  for(const sheet of sheets){
    const rect=sheet.el.getBoundingClientRect();
    const distance=focusY<rect.top?rect.top-focusY:focusY>rect.bottom?focusY-rect.bottom:0;
    if(distance<closestDistance){closestDistance=distance;closest=sheet.number}
    if(rect.bottom>=viewRect.top-950&&rect.top<=viewRect.bottom+950)renderSheet(sheet);
    else if(rect.bottom<viewRect.top-3200||rect.top>viewRect.bottom+3200){
      if(sheet.renderedAt)clearSheet(sheet);
    }
  }
  if(closest!==currentPage){currentPage=closest;updateToolbar()}
}
function scheduleVisibleUpdate(){
  if(scrollingUpdate)return;
  scrollingUpdate=true;
  requestAnimationFrame(()=>{scrollingUpdate=false;updateVisiblePages()});
}
function goToPage(num,behavior='smooth'){
  if(!ready)return;
  num=clamp(Math.round(num),1,pdf.numPages);
  currentPage=num;
  updateToolbar();
  viewport.scrollTo({top:sheets[num-1].el.offsetTop-16,behavior});
  scheduleVisibleUpdate();
}
function applyScale(newScale){
  if(!ready)return;
  const anchorPage=currentPage;
  scale=clamp(newScale,.4,3.4);
  for(const sheet of sheets){clearSheet(sheet);setSheetSize(sheet)}
  updateToolbar();
  goToPage(anchorPage,'auto');
  scheduleVisibleUpdate();
}


/* Le mode Présenter utilise un canvas indépendant du défilement standard. */
async function renderPresentationPage(){
  if(!presenting||!ready)return;
  const generation=++presentationGeneration;
  if(presentationRenderTask){
    try{presentationRenderTask.cancel()}catch(e){}
    presentationRenderTask=null;
  }
  presentationStage.replaceChildren();
  try{
    const page=await pdf.getPage(presentationPage);
    if(generation!==presentationGeneration||!presenting)return;
    const original=page.getViewport({scale:1});
    const maxWidth=Math.max(160,presentationStage.clientWidth-48);
    const maxHeight=Math.max(160,presentationStage.clientHeight-30);
    const presentationScale=Math.min(maxWidth/original.width,maxHeight/original.height);
    const pageViewport=page.getViewport({scale:presentationScale});
    const ratio=clamp(window.devicePixelRatio||1,1,2);
    const canvas=document.createElement('canvas');
    const ctx=canvas.getContext('2d',{alpha:false});
    if(!ctx)throw new Error('Affichage canvas indisponible');
    canvas.width=Math.round(pageViewport.width*ratio);
    canvas.height=Math.round(pageViewport.height*ratio);
    canvas.style.width=pageViewport.width+'px';
    canvas.style.height=pageViewport.height+'px';
    const task=page.render({
      canvasContext:ctx,
      viewport:pageViewport,
      transform:ratio!==1?[ratio,0,0,ratio,0,0]:undefined
    });
    presentationRenderTask=task;
    await task.promise;
    if(generation!==presentationGeneration||!presenting)return;
    presentationStage.replaceChildren(canvas);
  }catch(err){
    if(err?.name!=='RenderingCancelledException'&&generation===presentationGeneration&&presenting){
      console.error('Erreur du mode présentation :',err);
      const message=document.createElement('p');
      message.textContent='Cette page ne peut pas être affichée.';
      presentationStage.replaceChildren(message);
    }
  }finally{
    if(generation===presentationGeneration)presentationRenderTask=null;
  }
}
function showPresentationPage(number){
  if(!presenting||!ready)return;
  presentationPage=clamp(Math.round(number),1,pdf.numPages);
  presentationCounter.textContent=presentationPage+' / '+pdf.numPages;
  presentationPrevious.disabled=presentationPage<=1;
  presentationNext.disabled=presentationPage>=pdf.numPages;
  renderPresentationPage();
}
function openPresentation(){
  if(!ready||presenting)return;
  presenting=true;
  presentationLastFocus=document.activeElement;
  presentation.hidden=false;
  presentationPage=currentPage;
  showPresentationPage(presentationPage);
  presentationClose.focus({preventScroll:true});
  if(presentation.requestFullscreen){
    presentation.requestFullscreen().catch(()=>{/* Le mode présentation reste accessible sans plein écran natif. */});
  }
}
function closePresentation(){
  if(!presenting)return;
  presenting=false;
  ++presentationGeneration;
  if(presentationRenderTask){
    try{presentationRenderTask.cancel()}catch(e){}
    presentationRenderTask=null;
  }
  presentationStage.replaceChildren();
  presentation.hidden=true;
  if(document.fullscreenElement===presentation){
    document.exitFullscreen().catch(()=>{});
  }
  goToPage(presentationPage,'auto');
  (presentationLastFocus||fitButton).focus({preventScroll:true});
}

async function main(){
  if(!documentInfo){
    errorState('Le lien du document est incorrect. Revenez à la page Projets.');
    return;
  }
  document.title=documentInfo.title+' | Clovis Langlois';
  document.getElementById('document-title').textContent=documentInfo.title;
  try{
    statusText.textContent='Lecture du fichier PDF depuis le portfolio…';
    const loading=pdfjsLib.getDocument({url:new URL(documentInfo.file,location.href).href});
    loading.onProgress=({loaded,total})=>{
      if(total>0)statusText.textContent='Chargement du document : '+Math.round(100*loaded/total)+' %';
    };
    pdf=await loading.promise;
    const first=await pdf.getPage(1);
    const firstViewport=first.getViewport({scale:1});
    firstWidth=firstViewport.width;
    firstHeight=firstViewport.height;
    scale=fitScale();
    lastViewerWidth=viewport.clientWidth;
    pagesEl.replaceChildren();
    sheets=Array.from({length:pdf.numPages},(_,i)=>{
      const el=document.createElement('section');
      el.className='pdf-page is-loading';
      el.setAttribute('aria-label','Page '+(i+1)+' sur '+pdf.numPages);
      pagesEl.appendChild(el);
      const sheet={number:i+1,el,page:i===0?first:null,baseWidth:firstWidth,baseHeight:firstHeight,generation:0,loading:false,renderTask:null,renderedAt:0};
      setSheetSize(sheet);
      return sheet;
    });
    totalPages.textContent=pdf.numPages;
    ready=true;
    controls.forEach(control=>control.disabled=false);
    currentPage=1;
    updateToolbar();
    await renderSheet(sheets[0]);
    if(overlay.classList.contains('is-error'))return;
    overlay.hidden=true;
    scheduleVisibleUpdate();
  }catch(err){
    console.error('Impossible de charger le dossier :',err);
    errorState('Le fichier PDF n’a pas pu être chargé. Vérifiez votre connexion, puis réessayez.');
  }
}
document.getElementById('retry').addEventListener('click',()=>location.reload());
previous.addEventListener('click',()=>goToPage(currentPage-1));
next.addEventListener('click',()=>goToPage(currentPage+1));
pageInput.addEventListener('change',()=>goToPage(Number(pageInput.value)||currentPage));
pageInput.addEventListener('keydown',event=>{if(event.key==='Enter'){pageInput.blur();goToPage(Number(pageInput.value)||currentPage)}});
zoomIn.addEventListener('click',()=>applyScale(scale*1.18));
zoomOut.addEventListener('click',()=>applyScale(scale/1.18));
fitButton.addEventListener('click',openPresentation);
presentationPrevious.addEventListener('click',()=>showPresentationPage(presentationPage-1));
presentationNext.addEventListener('click',()=>showPresentationPage(presentationPage+1));
presentationClose.addEventListener('click',closePresentation);
document.addEventListener('fullscreenchange',()=>{
  if(presenting){
    if(document.fullscreenElement!==presentation)closePresentation();
    else renderPresentationPage();
  }
});
let presentationTouchX=null;
presentationStage.addEventListener('touchstart',event=>{
  if(event.touches.length===1)presentationTouchX=event.touches[0].clientX;
},{passive:true});
presentationStage.addEventListener('touchend',event=>{
  if(!presenting||presentationTouchX===null)return;
  const delta=event.changedTouches[0].clientX-presentationTouchX;
  presentationTouchX=null;
  if(Math.abs(delta)>65)showPresentationPage(presentationPage+(delta<0?1:-1));
},{passive:true});
viewport.addEventListener('scroll',scheduleVisibleUpdate,{passive:true});
window.addEventListener('resize',()=>{
  if(!ready)return;
  if(presenting)renderPresentationPage();
  if(viewport.clientWidth===lastViewerWidth)return;
  lastViewerWidth=viewport.clientWidth;
  applyScale(fitScale());
});
window.addEventListener('keydown',event=>{
  if(!ready)return;
  if(presenting){
    if(event.key==='Escape'){event.preventDefault();closePresentation();return}
    if(event.key==='ArrowRight'||event.key==='ArrowDown'||event.key==='PageDown'){
      event.preventDefault();showPresentationPage(presentationPage+1);return;
    }
    if(event.key==='ArrowLeft'||event.key==='ArrowUp'||event.key==='PageUp'){
      event.preventDefault();showPresentationPage(presentationPage-1);return;
    }
    return;
  }
  if(event.target instanceof HTMLInputElement)return;
  if(event.key==='ArrowRight'||event.key==='PageDown'){event.preventDefault();goToPage(currentPage+1)}
  else if(event.key==='ArrowLeft'||event.key==='PageUp'){event.preventDefault();goToPage(currentPage-1)}
});
main();
</script>
</body>
</html>
