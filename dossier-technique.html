<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Dossier technique - Clovis Langlois</title>
<style>
html,body{margin:0;min-height:100%;background:#161b24;color:#eaf0fa;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:700px;margin:18vh auto 0;padding:32px}
h1{font-size:clamp(22px,4vw,32px);font-weight:600}
p{color:#c1cedf;line-height:1.7}
a{color:#9fc9ff;text-underline-offset:4px}
</style>
</head>
<body>
<main>
<h1>Ouverture du dossier technique…</h1>
<p>Le document va s’ouvrir dans une visionneuse PDF.</p>
<p id="fallback" hidden>Si la visionneuse ne s’ouvre pas, <a id="viewer-link" href="#" rel="noopener noreferrer">ouvrir le dossier technique</a> ou <a id="original-link" href="#" rel="noopener noreferrer">accéder au PDF original</a>.</p>
</main>
<script>
(function(){
  const documents={
    infrastructure:{
      title:"Infrastructure virtualisée sécurisée - Langéo Education",
      url:"https://assets.zyrosite.com/kDsAjPW6LAjAZlYh/projet-langa-c-o-education-UWEqbAn0rlhG6OTt.pdf"
    },
    "haute-disponibilite":{
      title:"Cluster Proxmox, haute disponibilité et sauvegardes - Langéo Education",
      url:"https://assets.zyrosite.com/kDsAjPW6LAjAZlYh/projet-haute-disponibilita-c-sauvegarde-o7WweDvAqcZzUuVI.pdf"
    }
  };
  const key=new URLSearchParams(location.search).get("projet");
  const documentInfo=documents[key];
  if(!documentInfo){
    document.querySelector("h1").textContent="Dossier technique introuvable";
    document.querySelector("main>p").textContent="Retournez à la page Projets pour sélectionner un dossier.";
    return;
  }
  document.title=documentInfo.title+" | Dossier technique";
  const viewerUrl="https://docs.google.com/gview?embedded=1&url="+encodeURIComponent(documentInfo.url);
  document.getElementById("viewer-link").href=viewerUrl;
  document.getElementById("original-link").href=documentInfo.url;
  document.getElementById("fallback").hidden=false;
  // Navigation de premier niveau : évite le refus d'intégration de docs.google.com dans une iframe (ERR_BLOCKED_BY_RESPONSE).
  window.location.replace(viewerUrl);
})();
</script>
</body>
</html>
